# Weekly npm bumps + github-actions bumps (keeps the SHA pins fresh).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Majors (commander 15, ...) are deliberate migrations,
      # not auto-bumps — typecheck alone can't validate runtime behavior.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # demo-render's local-voice install (kokoro-js, pinned by this lockfile;
  # sharp is overridden past its advisories in package.json there).
  - package-ecosystem: npm
    directory: "/.github/local-voice"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
