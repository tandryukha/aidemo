name: ci

# PR gate + main build status: typecheck + gitleaks secret scan + unit tests +
# MCP image check + dependency review. External PRs run only after maintainer
# approval (Actions setting).
# Never uses secrets; the workflow token is read-only. The push trigger keeps
# the README build badge truthful for main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists PR commits

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # devDependencies carry the latest @types/node; the engine supports Node
      # down to package.json "engines". Typecheck again against that floor's
      # own types, so an API newer than the floor can't slip in.
      - name: Typecheck against the supported Node floor's types
        run: |
          floor=$(node -p 'require("./package.json").engines.node.replace(/^>=\s*/, "")')
          npm i --no-save --ignore-scripts --no-audit --no-fund "@types/node@~$floor"
          node -p '"@types/node " + require("@types/node/package.json").version'
          npm run typecheck

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false # commenting would need PR write access

  # Unit tests (no Chrome, no ffmpeg) on every supported LTS line: 22 is the
  # floor, 26 the active LTS. The e2e render and MCP smoke tests still need a
  # local machine.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  # The MCP-server image that directories (e.g. Glama) build from the
  # Dockerfile: build it and run the MCP handshake inside. The image installs
  # the latest npm release, so this guards the Dockerfile and its base image;
  # this commit's stdio entry is covered by npm test (test/mcp-stdio.mjs).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build -t aidemo-mcp .

      - run: node test/mcp-image.mjs aidemo-mcp

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
