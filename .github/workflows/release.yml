name: release

# Cut a release automatically when package.json "version" changes on main:
# create the immutable vX.Y.Z tag, move the `stable` pointer, and publish a
# GitHub Release. No-op for commits that don't bump the version.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes_tag:
        description: >-
          Rewrite the GitHub Release notes of an existing tag (e.g. v0.17.0)
          from its release commit, instead of cutting a release
        required: false
        default: ""

# Least privilege: the workflow itself needs nothing; the one job that tags,
# releases and publishes asks for exactly what it uses.
permissions:
  contents: read

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || inputs.notes_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag, move `stable`, publish the Release
      id-token: write # npm provenance / OIDC trusted publishing / MCP Registry login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # active LTS; its bundled npm 11 publishes via OIDC

      - name: Detect version change
        id: ver
        run: |
          new=$(node -p "require('./package.json').version")
          old=$(git show HEAD~1:package.json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          if [ "$new" != "$old" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::version $old -> $new — cutting release"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::version unchanged ($new) — no release"
          fi

      - name: Tag, move stable, publish release
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="v${{ steps.ver.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Immutable semver tag (create once).
          if ! git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            git tag -a "$v" -m "$v"
            git push origin "$v"
          fi

          # Moving `stable` pointer that consumers resolve via npx.
          git tag -f stable
          git push -f origin stable

          # GitHub Release (create once). Notes = the release commit's body
          # (the human summary of what shipped; direct pushes have no PRs for
          # --generate-notes to list), trailers stripped, prepended to the
          # generated PR list + compare link.
          if ! gh release view "$v" >/dev/null 2>&1; then
            summary="$(git log -1 --format=%b HEAD \
              | grep -viE '^(Co-Authored-By|Claude-Session|Signed-off-by):' || true)"
            notes=()
            if [ -n "$summary" ]; then notes=(--notes "$summary"); fi
            gh release create "$v" --title "$v" "${notes[@]}" --generate-notes
          fi

      # npm publish — dormant until you opt in by setting repo variable
      # NPM_PUBLISH=true (after the one-time first publish + trusted-publisher
      # config on npmjs). Uses OIDC trusted publishing + provenance: no token
      # secret. Idempotent — skips a version already on npm.
      - name: Publish to npm (provenance, OIDC)
        if: steps.ver.outputs.changed == 'true' && vars.NPM_PUBLISH == 'true'
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.new }}"
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$v" version >/dev/null 2>&1; then
            echo "::notice::$name@$v already on npm — skipping publish"; exit 0
          fi
          # OIDC trusted publishing needs npm >= 11.5.1: the npm bundled with the
          # Node set up above has it (no unpinned npm@latest in the release path).
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for OIDC trusted publishing (needs >= 11.5.1)"; exit 1; }
          npm publish --provenance --access public
          echo "::notice::published $name@$v to npm"

      # MCP Registry: GitHub OIDC login (the id-token permission above), no
      # secret. After npm because the registry checks the published package's
      # mcpName. Idempotent — skips a version already listed. mcp-publisher is
      # pinned by version + sha256; bump both deliberately, never releases/latest.
      - name: Publish to the MCP Registry (OIDC)
        if: steps.ver.outputs.changed == 'true' && vars.NPM_PUBLISH == 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.new }}"
          listed="$(node -p "require('./server.json').version")"
          if [ "$listed" != "$v" ]; then
            echo "::error::server.json says $listed, package.json says $v"; exit 1
          fi
          url="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.tandryukha%2Faidemo/versions/$v"
          if curl --silent --fail --output /dev/null "$url"; then
            echo "::notice::$v already on the MCP Registry — skipping publish"; exit 0
          fi
          # npm can take minutes to serve a new version, and the registry answers
          # 400 until it does. Times out after 20 min and fails the step.
          bash scripts/wait-for-npm-version.sh "$(node -p "require('./package.json').name")" "$v"
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/$archive"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check --status
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "::notice::published io.github.tandryukha/aidemo $v to the MCP Registry"

      # Homebrew tap: the tap repo (tandryukha/homebrew-aidemo) bumps its own
      # formula from npm on a daily schedule with its own GITHUB_TOKEN — no
      # cross-repo PAT here. To pull it forward right after a release:
      #   gh workflow run bump.yml -R tandryukha/homebrew-aidemo

  # Manual: rewrite an existing release's notes from its release commit (the
  # same summary + generated PR list a new release gets). Run from the Actions
  # tab with notes_tag=vX.Y.Z.
  notes:
    if: github.event_name == 'workflow_dispatch' && inputs.notes_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Rewrite release notes from the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.notes_tag }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*) ;; *) echo "::error::notes_tag must be a vX.Y.Z tag"; exit 1 ;; esac
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::no tag $TAG"; exit 1; }
          summary="$(git log -1 --format=%b "$TAG^{commit}" \
            | grep -viE '^(Co-Authored-By|Claude-Session|Signed-off-by):' || true)"
          # Previous version tag, for the generated PR list + compare link.
          prev="$(git tag -l 'v*' --sort=-v:refname | grep -A1 -xF "$TAG" | sed -n 2p)"
          generated="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" ${prev:+-f previous_tag_name="$prev"} --jq .body)"
          { [ -n "$summary" ] && printf '%s\n\n' "$summary"; printf '%s\n' "$generated"; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
          echo "::notice::rewrote the $TAG release notes ($(wc -l < notes.md) lines)"
