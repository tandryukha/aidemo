name: scorecard

# OpenSSF Scorecard: publishes results to the Scorecard API for the README
# badge. The API serves the result for main's current HEAD commit only — a
# result for an older commit is invisible to the badge, which then reads
# "invalid repo path". So run on every push to main, not just weekly.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_format: sarif
          results_file: results.sarif
          publish_results: true
