name: demo-render

# Self-test for the aidemo Action: render the bundled fixture (examples/local-demo)
# through the LOCAL action (uses: ./) with local Kokoro voice and no API keys.
# Manual trigger only. ubuntu-latest ships Chrome but NOT ffmpeg, so we install
# it below; the first run also downloads the ~90 MB Kokoro model (cached after).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships Chrome but not ffmpeg — the compose stage needs it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Local-voice dependency, deliberately kept out of package.json (~400 MB of
      # onnxruntime). --ignore-scripts keeps the engine's install script-free; the
      # engine's own `import("kokoro-js")` resolves this from the repo node_modules.
      - name: Install local-voice dependency
        run: npm i --no-save --ignore-scripts kokoro-js

      # Cache the Kokoro model dir so re-runs skip the huggingface.co download.
      # transformers.js caches under $HF_HOME (default ~/.cache/huggingface).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-q8

      # The fixture storyboard drives http://localhost:8787 — serve it.
      - name: Start fixture server
        run: |
          node examples/local-demo/serve.mjs &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8787/ >/dev/null && break
            sleep 0.5
          done

      - name: Render fixture via the local action
        id: render
        uses: ./
        with:
          demos: examples/local-demo
          command: render
          tts: local
          gif: "true"
          engine-path: "." # exercise THIS checkout's engine, not github:stable

      # The action's outputs list what it rendered: media (mp4 + gif) and the
      # caption files compose writes next to the video.
      - name: Check the action outputs
        env:
          MEDIA: ${{ steps.render.outputs.media }}
          CAPTIONS: ${{ steps.render.outputs.captions }}
        run: |
          set -euo pipefail
          printf 'media:\n%s\ncaptions:\n%s\n' "$MEDIA" "$CAPTIONS"
          for f in examples/local-demo/output/final-demo.mp4 examples/local-demo/output/final-demo.gif; do
            grep -qxF "$f" <<<"$MEDIA" || { echo "::error::media output lacks $f"; exit 1; }
          done
          for f in examples/local-demo/output/final-demo.srt examples/local-demo/output/final-demo.vtt; do
            grep -qxF "$f" <<<"$CAPTIONS" || { echo "::error::captions output lacks $f"; exit 1; }
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done
          head -1 examples/local-demo/output/final-demo.vtt | grep -qx 'WEBVTT'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-demo
          path: |
            examples/local-demo/output/final-demo.mp4
            examples/local-demo/output/final-demo.gif
            examples/local-demo/output/final-demo.srt
            examples/local-demo/output/final-demo.vtt
          if-no-files-found: error
